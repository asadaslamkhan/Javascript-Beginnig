<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Math if-else</h2>

    <p id="demo"></p>

    <script>
        let text;
        if(Math.random() < 1) {
            text = "Hello";
        } else {
            text = "Goodbye";
        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
