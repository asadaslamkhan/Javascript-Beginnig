<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop</title>
</head>

<body>
    <h1>JavaScript Loops</h1>
    <h2>The for Loop</h2>


    <p id="demo"></p>


    <script>

        
        for (let i = 0; i < 10; i++) {
            console.log("The number is " + i + "<br>");
        }

        
    </script>

</body>

</html>
