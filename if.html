<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if statement</title>
</head>
<body>
    <h1>JavaScript If...Else Statements</h1>

    <p id="demo"></p>


    <script>
        let age = 9;
        
        if (age >= 18) {
            text = "You are eligible for rollercoaster ride";
        }
        else {
            text = "You are not eligible for rollercoaster ride";
        }
        document.getElementById("demo").innerHTML = age + " years old. " + text;
    </script>
</body>
</html>
